
name: Deploy Laravel Sendmail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sendmail-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel
    runs-on: [self-hosted, Linux, X64]

    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Deploy Laravel
        run: |
          set -euo pipefail

          APP_DIR="/var/www/sendmail"
          BRANCH="main"

          echo "================================"
          echo " Deploy Laravel Sendmail"
          echo "================================"

          echo "== Checking environment =="
          whoami
          php -v
          composer --version

          echo "== Checking project directory =="
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: Project directory not found"
            exit 1
          fi

          cd "$APP_DIR"

          echo "== Checking Laravel files =="
          if [ ! -f artisan ]; then
            echo "ERROR: Laravel artisan not found"
            exit 1
          fi

          if [ ! -f .env ]; then
            echo "ERROR: .env not found"
            exit 1
          fi

          if [ ! -f composer.json ]; then
            echo "ERROR: composer.json not found"
            exit 1
          fi

          if [ ! -f composer.lock ]; then
            echo "ERROR: composer.lock not found"
            exit 1
          fi

          echo "== Checking Git status =="
          git status --short

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: Local tracked changes detected"
            exit 1
          fi

          echo "== Checking write permissions =="
          if [ ! -w "$APP_DIR" ]; then
            echo "ERROR: No write permission on project"
            exit 1
          fi

          if [ ! -w storage ]; then
            echo "ERROR: No write permission on storage"
            exit 1
          fi

          if [ ! -w bootstrap/cache ]; then
            echo "ERROR: No write permission on bootstrap/cache"
            exit 1
          fi

          echo "== Fetching repository =="
          git fetch origin "$BRANCH"

          echo "== Checking branch =="
          CURRENT_BRANCH="$(git branch --show-current)"

          if [ "$CURRENT_BRANCH" != "$BRANCH" ]; then
            echo "ERROR: Expected branch $BRANCH"
            exit 1
          fi

          echo "== Updating project =="
          git pull --ff-only origin "$BRANCH"

          echo "== Installing Composer dependencies =="
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress

          echo "== Clearing Laravel cache =="
          php artisan optimize:clear

          echo "== Rebuilding Laravel cache =="
          php artisan config:cache
          php artisan view:cache

          echo "== Restarting Laravel queue workers =="
          php artisan queue:restart

          echo "== Checking Laravel =="
          php artisan --version

          echo "== Deployment information =="
          git log -1 --format='%h %s'

          echo "================================"
          echo " Deployment completed successfully"
          echo "================================"
